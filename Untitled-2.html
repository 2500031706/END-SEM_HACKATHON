<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>EduSphere | Learning Management System</title>

<!-- REACT JS LIBRARIES -->

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>

<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>


<!-- =====================================
     CSS - WEBSITE DESIGN
====================================== -->

<style>

:root {
    font-family: Inter, "Segoe UI", sans-serif;

    --bg: #f7f6fb;
    --panel: #ffffff;
    --ink: #29223b;
    --muted: #777087;
    --line: #e8e4ef;
    --primary: #6842b8;
    --soft: #f0eafb;
    --sidebar: #24183e;

    color-scheme: light;
}

:root[data-theme="dark"] {
    --bg: #171320;
    --panel: #231d31;
    --ink: #f1edf8;
    --muted: #b4a9c6;
    --line: #3c324c;
    --primary: #ad8aef;
    --soft: #362649;
    --sidebar: #1e152f;

    color-scheme: dark;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    min-width: 320px;
    background: var(--bg);
    color: var(--ink);
}

h1, h2, p {
    margin: 0;
}

h1 {
    font-size: 32px;
}

h2 {
    font-size: 20px;
}

p {
    color: var(--muted);
    line-height: 1.7;
}

small {
    color: var(--muted);
    font-size: 13px;
}

button, input, textarea, select {
    font: inherit;
}

button {
    background: #6842b8;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    cursor: pointer;
    font-weight: 600;
    transition: 0.2s;
}

button:hover:not(:disabled) {
    background: #5633a1;
    transform: translateY(-1px);
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

input, textarea, select {
    width: 100%;
    min-width: 0;
    padding: 13px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    color: var(--ink);
}

input:focus, textarea:focus, select:focus {
    outline: 2px solid #9366dc;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

label {
    display: grid;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
}

/* LOGIN PAGE */

.login {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 100vh;
    background: var(--panel);
}

.welcome {
    position: relative;
    overflow: hidden;
    min-height: 100vh;
    padding: 50px clamp(30px, 5vw, 85px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;

    background:
        radial-gradient(
            ellipse at top right,
            #9168e1,
            transparent 45%
        ),
        linear-gradient(145deg, #2c1b52, #6842b8);

    color: white;
}

.welcome::before,
.welcome::after {
    content: "";
    position: absolute;
    width: 460px;
    height: 460px;
    border: 1px solid #ffffff30;
    border-radius: 50%;
    right: -170px;
    bottom: -180px;
    pointer-events: none;
}

.welcome::after {
    width: 570px;
    height: 570px;
    right: -180px;
    bottom: -210px;
}

.welcome > div,
.welcome > small {
    position: relative;
    z-index: 1;
}

.brand {
    font-size: 27px;
    font-weight: 800;
}

.brand small {
    display: block;
    font-size: 10px;
    letter-spacing: 2px;
    margin-top: 7px;
    color: #c8b8e9;
}

.welcome h1 {
    font-size: clamp(45px, 6vw, 80px);
    line-height: 1.1;
    letter-spacing: -2px;
    margin: 20px 0;
}

.welcome p {
    color: #e0d5f7;
    font-size: 18px;
    max-width: 450px;
}

.welcome small,
.welcome .eyebrow {
    color: #e0d5f7;
}

.features {
    margin-top: 30px;
    line-height: 2.3;
}

.loginform {
    position: relative;
    display: grid;
    place-items: center;
    padding: 40px;
}

.loginform form {
    width: min(100%, 430px);
    gap: 20px;
}

.loginform h1 {
    font-size: 36px;
}

.login-theme {
    position: absolute;
    top: 20px;
    right: 20px;
}

.roles {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    padding: 5px;
    border-radius: 12px;
    background: var(--soft);
}

.roles button {
    background: transparent;
    color: var(--muted);
    padding: 10px 6px;
}

.roles button.selected {
    background: var(--panel);
    color: var(--primary);
}

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 75px;
}

.password-box button {
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    color: var(--primary);
    padding: 8px;
}

.password-box button:hover:not(:disabled) {
    transform: translateY(-50%);
    background: var(--soft);
}

/* DASHBOARD LAYOUT */

.shell {
    display: grid;
    grid-template-columns: 248px minmax(0, 1fr);
    min-height: 100vh;
}

/* SIDEBAR */

.sidebar {
    position: sticky;
    top: 0;
    height: 100vh;
    background: var(--sidebar);
    color: white;
    padding: 30px 18px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    overflow: auto;
}

.role {
    background: #ffffff15;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    color: #ddcdf5;
}

.sidebar nav {
    display: grid;
    gap: 6px;
}

.sidebar nav button,
.logout {
    background: transparent;
    color: #d1c4e4;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 13px;
    font-size: 14px;
}

.sidebar nav button span {
    width: 22px;
    text-align: center;
}

.sidebar nav button.active {
    background: #7954c6;
    color: white;
}

.sidebar nav button:hover,
.logout:hover {
    background: #ffffff15;
}

.logout {
    margin-top: auto;
}

main {
    min-width: 0;
}

/* HEADER */

header {
    position: sticky;
    top: 0;
    z-index: 4;
    height: 76px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 0 30px;
}

.header-actions,
.breadcrumb {
    display: flex;
    align-items: center;
    gap: 12px;
}

.breadcrumb {
    font-size: 13px;
    color: var(--muted);
}

.icon-button {
    width: 40px;
    height: 40px;
    padding: 0;
    display: grid;
    place-items: center;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    font-size: 18px;
}

.icon-button:hover:not(:disabled) {
    background: var(--soft);
    color: var(--primary);
}

.avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    padding: 0;
}

.searchbox,
.notification-wrap {
    position: relative;
}

.searchbox input {
    width: 215px;
    background: var(--bg);
    font-size: 13px;
}

.dropdown {
    position: absolute;
    right: 0;
    top: calc(100% + 10px);
    min-width: 220px;
    max-width: 300px;
    max-height: 350px;
    overflow: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 12px 30px #0002;
    z-index: 8;
}

.dropdown button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    color: var(--ink);
    font-size: 13px;
}

.dropdown button:hover {
    background: var(--soft);
}

.mobile,
.scrim {
    display: none;
}

/* MAIN CONTENT */

.content {
    max-width: 1450px;
    margin: auto;
    padding: 30px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    animation: appear 0.3s ease;
}

.eyebrow {
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1.6px;
    color: var(--primary);
}

/* WELCOME BANNER */

.hero {
    background: linear-gradient(
        110deg, #5c36a7, #9366dc
    );

    padding: 32px;
    border-radius: 18px;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.hero h2 {
    font-size: 29px;
    margin: 10px 0;
}

.hero p,
.hero .eyebrow {
    color: #efe6fc;
}

.hero button {
    background: white;
    color: #6842b8;
    margin-top: 20px;
}

.hero-icon {
    font-size: 120px;
    color: #ffffff35;
}

/* CARDS */

.stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
}

.panel {
    background: var(--panel);
    padding: 22px;
    border: 1px solid var(--line);
    border-radius: 15px;
    box-shadow: 0 8px 28px #33204c09;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
}

.stats h2 {
    font-size: 32px;
    color: var(--primary);
}

.course {
    align-items: flex-start;
}

.course p {
    flex: 1;
}

.course button {
    width: 100%;
    margin-top: auto;
}

.courseicon {
    width: 50px;
    height: 50px;
    background: var(--soft);
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-size: 25px;
}

.announcement {
    border-left: 4px solid #9366dc;
}

/* FORMS */

.fields {
    display: grid;
    gap: 15px;
}

.fields > button {
    justify-self: start;
}

.loginform .fields > button {
    justify-self: stretch;
}

.submission {
    border-top: 1px solid var(--line);
    padding-top: 15px;
}

/* QUIZZES */

.option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px;
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    font-weight: normal;
}

.option:hover {
    background: var(--soft);
}

.option input {
    width: auto;
    accent-color: #6842b8;
}

/* PROGRESS */

.progress-container {
    width: 100%;
}

.progress {
    height: 10px;
    background: var(--soft);
    border-radius: 20px;
    overflow: hidden;
    margin: 8px 0;
}

.progress div {
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(
        90deg, #6842b8, #b391f0
    );
    transition: width 0.3s;
}

/* GRADES */

.tablewrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
}

th, td {
    padding: 15px;
    border-bottom: 1px solid var(--line);
}

th {
    background: var(--soft);
    color: var(--primary);
}

/* CERTIFICATE */

.certificate {
    text-align: center;
    align-items: center;
    border: 6px double #9f7dd9;
    padding: 45px;
    font-family: Georgia, serif;
}

.certificate h1 {
    color: var(--primary);
}

.award {
    font-size: 60px;
}

/* PROFILE */

.profile-avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: #6842b8;
    color: white;
    font-size: 35px;
    font-weight: bold;
}

/* DISCUSSION FORUM */

.post {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.empty {
    text-align: center;
    padding: 45px;
}

/* NOTIFICATIONS */

.toast {
    position: fixed;
    bottom: 25px;
    right: 25px;
    padding: 16px 22px;
    background: #2f2250;
    color: white;
    border-radius: 12px;
    box-shadow: 0 8px 25px #0003;
    z-index: 12;
}

/* ANIMATIONS */

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* RESPONSIVE DESIGN */

@media (max-width: 1100px) {

    .stats, .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .searchbox input {
        width: 160px;
    }
}

@media (max-width: 780px) {

    .login {
        grid-template-columns: 1fr;
    }

    .welcome {
        padding: 35px;
        min-height: 330px;
    }

    .features {
        display: none;
    }

    .loginform {
        padding: 65px 25px 35px;
    }

    .shell {
        display: block;
    }

    .sidebar {
        position: fixed;
        width: 248px;
        left: 0;
        top: 0;
        z-index: 10;
        transform: translateX(-100%);
        transition: transform 0.25s;
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .scrim {
        display: block;
        position: fixed;
        inset: 0;
        background: #0006;
        border-radius: 0;
        z-index: 9;
    }

    .mobile {
        display: block;
    }

    .breadcrumb span {
        display: none;
    }

    .content {
        padding: 18px;
    }

    header {
        padding: 0 15px;
    }

    .header-actions {
        gap: 6px;
    }

    .searchbox input {
        width: 120px;
    }

    .hero-icon {
        display: none;
    }
}

@media (max-width: 450px) {

    .cards {
        grid-template-columns: 1fr;
    }

    .stats {
        gap: 8px;
    }

    .stats .panel {
        padding: 14px;
    }

    .hero {
        padding: 22px;
    }

    .searchbox input {
        width: 95px;
    }

    .searchbox .dropdown {
        left: 0;
        right: auto;
    }

    .icon-button,
    .avatar {
        width: 32px;
        height: 32px;
    }

    header {
        gap: 6px;
        padding: 0 10px;
    }
}

@media (prefers-reduced-motion: reduce) {

    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}

</style>

</head>

<div id="root">Loading EduSphere...</div>


<!-- =====================================
     JAVASCRIPT - DATA AND FUNCTIONS
====================================== -->

<script>

const initialData = {

    courses: [
        {
            id: 1,
            title: "Java Programming",
            category: "Programming",
            instructor: "Computer Science Faculty",
            description: "Learn classes, objects, inheritance and modern Java.",
            icon: "💻"
        },

        {
            id: 2,
            title: "Artificial Intelligence & ML",
            category: "Data Science",
            instructor: "AI Faculty",
            description: "Explore artificial intelligence and machine learning.",
            icon: "🤖"
        },

        {
            id: 3,
            title: "Internet of Things",
            category: "Electronics",
            instructor: "Embedded Systems Faculty",
            description: "Build applications using sensors and microcontrollers.",
            icon: "🌐"
        }
    ],

    assignments: [
        {
            id: 1,
            course: 1,
            title: "Object-Oriented Programming",
            due: "2026-12-10"
        },

        {
            id: 2,
            course: 2,
            title: "Regression Analysis",
            due: "2026-12-12"
        }
    ],

    quizzes: [
        {
            id: 1,
            course: 1,
            question: "Which keyword is used for inheritance in Java?",
            options: [
                "implements",
                "extends",
                "import",
                "static"
            ],
            answer: 1
        },

        {
            id: 2,
            course: 2,
            question: "Which algorithm is used for clustering?",
            options: [
                "Linear Regression",
                "K-Means",
                "Binary Search",
                "Bubble Sort"
            ],
            answer: 1
        }
    ],

    posts: [
        {
            id: 1,
            author: "Faculty",
            text: "Welcome to EduSphere! Share your learning goals."
        }
    ],

    submissions: [],
    attempts: [],
    enrolled: {},
    completed: {},
    names: {}
};


/* NAVIGATION PAGES */

const pages = [
    ["▦", "Dashboard"],
    ["▤", "Courses"],
    ["▧", "Assignments"],
    ["?", "Quizzes"],
    ["↗", "Progress"],
    ["✓", "Grades"],
    ["☆", "Certificates"],
    ["☏", "Discussion Forum"],
    ["●", "Profile"]
];


/* GENERATE UNIQUE ID */

function uid() {
    return Date.now() + Math.random();
}


/* LOAD LOCAL STORAGE */

function loadData(key, fallback) {

    try {

        const data = localStorage.getItem(key);

        return data
            ? JSON.parse(data)
            : fallback;

    } catch {

        return fallback;
    }
}


/* SAVE LOCAL STORAGE */

function saveData(key, value) {

    try {

        localStorage.setItem(
            key,
            JSON.stringify(value)
        );

    } catch {

        console.log("LocalStorage unavailable");
    }
}


/* CREATE USER */

function createUser(email, role) {

    return {
        email: String(email).trim().toLowerCase(),
        role: role
    };
}


/* COURSE ENROLLMENT */

function enrollCourse(db, email, id) {

    return {
        ...db,

        enrolled: {
            ...db.enrolled,

            [email]: [
                ...new Set([
                    ...(db.enrolled[email] || []),
                    id
                ])
            ]
        }
    };
}


/* UPDATE COURSE PROGRESS */

function completeLesson(db, email, id) {

    return {
        ...db,

        completed: {
            ...db.completed,

            [email]: {
                ...db.completed[email],

                [id]: Math.min(
                    100,
                    (db.completed[email]?.[id] || 0) + 25
                )
            }
        }
    };
}


/* CREATE COURSE */

function createCourse(db, data, instructor) {

    const course = {
        id: uid(),
        title: data.get("title"),
        category: data.get("category"),
        description: data.get("description"),
        instructor: instructor,
        icon: "📚"
    };

    return {
        ...db,
        courses: [...db.courses, course]
    };
}


/* CREATE ASSIGNMENT */

function createAssignment(db, data) {

    return {
        ...db,

        assignments: [
            ...db.assignments,

            {
                id: uid(),
                course: Number(data.get("course")),
                title: data.get("title"),
                due: data.get("due")
            }
        ]
    };
}


/* SUBMIT ASSIGNMENT */

function submitAssignment(db, email, id, answer) {

    return {
        ...db,

        submissions: [

            ...db.submissions.filter(
                s => !(s.email === email && s.id === id)
            ),

            {
                id: id,
                email: email,
                content: answer,
                grade: null
            }
        ]
    };
}


/* FACULTY GRADING */

function assignGrade(db, submission, marks) {

    return {
        ...db,

        submissions: db.submissions.map(s =>

            s.id === submission.id &&
            s.email === submission.email

                ? {
                    ...s,
                    grade: Number(marks)
                }

                : s
        )
    };
}


/* CREATE QUIZ */

function createQuiz(db, data) {

    return {
        ...db,

        quizzes: [
            ...db.quizzes,

            {
                id: uid(),
                course: Number(data.get("course")),
                question: data.get("question"),

                options: [
                    data.get("a"),
                    data.get("b"),
                    data.get("c"),
                    data.get("d")
                ],

                answer: Number(data.get("correct"))
            }
        ]
    };
}


/* QUIZ EVALUATION */

function evaluateQuiz(db, email, quiz, option) {

    const correct = Number(option) === quiz.answer;

    return {
        ...db,

        attempts: [

            ...db.attempts.filter(
                a => !(a.email === email && a.id === quiz.id)
            ),

            {
                id: quiz.id,
                email: email,
                score: correct ? 100 : 0
            }
        ]
    };
}


/* DISCUSSION FORUM */

function createPost(db, name, message) {

    return {
        ...db,

        posts: [
            ...db.posts,

            {
                id: uid(),
                author: name,
                text: message
            }
        ]
    };
}


/* UPDATE PROFILE */

function updateProfile(db, email, name) {

    return {
        ...db,

        names: {
            ...db.names,
            [email]: name
        }
    };
}


/* SEARCH FUNCTION */

function searchWorkspace(db, query) {

    const items = [

        ...pages.map(p => ({
            label: p[1],
            page: p[1]
        })),

        ...db.courses.map(c => ({
            label: c.title,
            page: "Courses"
        })),

        ...db.assignments.map(a => ({
            label: a.title,
            page: "Assignments"
        }))
    ];

    return items.filter(item =>

        item.label.toLowerCase().includes(
            query.trim().toLowerCase()
        )
    );
}


/* CERTIFICATE GENERATION */

function printCertificate(name, course) {

    const win = window.open(
        "",
        "_blank",
        "width=800,height=600"
    );

    if (!win) {

        alert("Please allow pop-ups.");
        return;
    }

    win.document.title = "EduSphere Certificate";

    const certificate =
        win.document.createElement("div");

    certificate.style.cssText = `
        border: 8px double #6842b8;
        padding: 60px;
        margin: 30px;
        text-align: center;
        font-family: Georgia, serif;
    `;

    const lines = [
        "EDUSPHERE",
        "CERTIFICATE OF COMPLETION",
        "This certificate is awarded to",
        name,
        "For successfully completing",
        course,
        new Date().toLocaleDateString()
    ];

    lines.forEach((line, index) => {

        const element = win.document.createElement(
            index === 1 || index === 3
                ? "h1"
                : "p"
        );

        element.textContent = line;

        certificate.appendChild(element);
    });

    win.document.body.appendChild(certificate);

    win.focus();
    win.print();
}

</script>

/* =====================================

====================================== */

function Course({
    course,
    progress,
    label,
    action,
    disabled
}) {

    return (

        <article className="panel course">

            <div className="courseicon">
                {course.icon || "📚"}

            <small>{course.category}</small>

                <Progress value={progress} />

            )}

                <button

                    disabled={disabled}

            )}

/* PROGRESS COMPONENT */

function Progress({ value }) {

    return (

        <div className="progress-container">

            <div
                className="progress"
                role="progressbar"
                aria-valuemin={0}
                aria-valuemax={100}

            </div>

            <small>
                {value}% Completed

}


/* EMPTY COMPONENT */

function Empty({ text }) {

}


/* =====================================
   MAIN REACT APPLICATION
====================================== */

function App() {

    const [user, setUser] = useState(
        () => loadData("edu-user", null)
    );

    const [db, setDb] = useState(
        () => loadData("edu-data-v1", initialData)
    );

    const [dark, setDark] = useState(
        () => loadData("edu-dark-mode", false)
    );

    const [page, setPage] = useState("Dashboard");

    const [search, setSearch] = useState("");

    const [notice, setNotice] = useState("");

    const [menu, setMenu] = useState(false);

    const [notifications, setNotifications] =
        useState(false);


    /* SAVE USER */

    useEffect(() => {

        saveData("edu-user", user);

    }, [user]);


    /* SAVE DATABASE */

    useEffect(() => {

        saveData("edu-data-v1", db);

    }, [db]);


    /* DARK MODE */

    useEffect(() => {

        document.documentElement.dataset.theme =
            dark ? "dark" : "light";

        saveData("edu-dark-mode", dark);

    }, [dark]);


    /* AUTO HIDE NOTIFICATION */

    useEffect(() => {

        if (notice) {

            const timer = setTimeout(
                () => setNotice(""),
                3000
            );

            return () => clearTimeout(timer);
        }

    }, [notice]);


    /* LOGIN FUNCTION */

    function login(email, role) {

        setUser(createUser(email, role));

        setPage("Dashboard");
    }


    /* LOGOUT FUNCTION */

    function logout() {

        setUser(null);
        setPage("Dashboard");
        setSearch("");
        setMenu(false);
        setNotice("");
        setNotifications(false);

    /* PAGE NAVIGATION */

        setPage(title);
        setSearch("");
        setMenu(false);
        setNotifications(false);

    /* UPDATE DATABASE */

        setDb(fn);
        setNotice(message);

        const form = e.currentTarget;

            message

        }

                <button

                            className="mobile"

                            ☰

                        </span>

                    </div>

                    {page === "Quizzes" && (

                                <form

                                    />

                                            <tr key={"q" + a.id + a.email}>

                                                <td>

                                                    {db.quizzes.find(
                                                        q => q.id === a.id
                                                    )?.question}

                                                </td>

                                                {!student && <td>{a.email}</td>}

                                                <td>{a.score}%</td>

                                            </tr>

                                        ))}

                                    </tbody>

                                </table>

                            </div>

                        </article>

                    )}


                    {/* =====================================
                        PAGE 8 - CERTIFICATES
                    ====================================== */}

                    {page === "Certificates" && (

                        student ? (

                            completed.length ? (

                                completed.map(c => (

                                    <article

                                        className="panel certificate"

                                        key={c.id}
                                    >

                                        <div className="award">

                                            🏆

                                        </div>

                                        <small>EDUSPHERE</small>

                                        <h2>

                                            Certificate of Completion

                                        </h2>

                                        <p>

                                            This certificate is awarded to

                                        </p>

                                        <h1>{name}</h1>

                                        <p>

                                            For successfully completing

                                        </p>

                                        <h2>{c.title}</h2>

                                        <button

                                            onClick={() =>
                                                printCertificate(name, c.title)
                                            }
                                        >

                                            Print Certificate

                                        </button>

                                    </article>

                                ))

                            ) : (

                                <Empty text="Complete a course to unlock your certificate." />

                            )

                        ) : (

                            <article className="panel">

                                <h2>Completed Courses</h2>

                                {Object.entries(db.completed).flatMap(

                                    ([studentEmail, items]) =>

                                        Object.entries(items)

                                            .filter(([, p]) => p === 100)

                                            .map(([id]) => (

                                                <p key={studentEmail + id}>

                                                    {studentEmail} — {courseName(id)}

                                                </p>

                                            ))
                                )}

                            </article>

                        )

                    )}


                    {/* =====================================
                        PAGE 9 - DISCUSSION FORUM
                    ====================================== */}

                    {page === "Discussion Forum" && (

                        <>

                            <form

                                className="panel fields"

                                onSubmit={e => {

                                    e.preventDefault();

                                    const form = e.currentTarget;

                                    const message = String(

                                        new FormData(form).get("message")

                                    ).trim();

                                    if (!message) return;

                                    update(

                                        d => createPost(d, name, message),

                                        "Message posted!"
                                    );

                                    form.reset();
                                }}
                            >

                                <h2>Start a Discussion</h2>

                                <textarea

                                    name="message"

                                    placeholder="Share your ideas..."

                                    required
                                />

                                <button>

                                    Post Message

                                </button>

                            </form>


                            {[...db.posts].reverse().map(p => (

                                <article className="panel" key={p.id}>

                                    <strong>{p.author}</strong>

                                    <p className="post">

                                        {p.text}

                                    </p>

                                </article>

                            ))}

                        </>

                    )}


                    {/* =====================================
                        PAGE 10 - PROFILE
                    ====================================== */}

                    {page === "Profile" && (

                        <form

                            className="panel fields"

                            onSubmit={e => {

                                e.preventDefault();

                                const f = new FormData(e.currentTarget);

                                const newName = String(
                                    f.get("name")
                                ).trim();

                                if (!newName) return;

                                update(

                                    d => updateProfile(
                                        d,
                                        email,
                                        newName
                                    ),

                                    "Profile updated!"
                                );
                            }}
                        >

                            <div className="profile-avatar">

                                {name[0]?.toUpperCase()}

                            </div>

                            <h2>Personal Information</h2>

                            <label>

                                Display Name

                                <input

                                    name="name"

                                    defaultValue={name}

                                    required
                                />

                            </label>

                            <label>

                                Email Address

                                <input value={email} readOnly />

                            </label>

                            <label>

                                Account Role

                                <input value={user.role} readOnly />

                            </label>

                            <button>

                                Save Profile

                            </button>

                        </form>

                    )}

                </section>

            </main>


            {/* TOAST NOTIFICATION */}

            {notice && (

                <div className="toast" role="status">

                    {notice}

                </div>

            )}

        </div>
    );
}


/* =====================================
   START REACT APPLICATION
====================================== */

const root = ReactDOM.createRoot(
    document.getElementById("root")
);

root.render(<App />);

</script>

</body>

</html>
